# Test-only overrides. This file exists only on the test classpath and, being under
# classpath:/config/, takes precedence over src/main/resources/application.properties.
# Tests must never write to the development database (POSTGRES_DB). They use a
# dedicated database instead; create it once with:
#   docker exec request-management-db psql -U request_user -d postgres -c "CREATE DATABASE masar_test"
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${MASAR_TEST_DB:masar_test}
