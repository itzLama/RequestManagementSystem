spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:request_management}
spring.datasource.username=${POSTGRES_USER:request_user}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.file-size-threshold=1MB

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:2}

spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

masar.mail.from=${MASAR_MAIL_FROM:no-reply@masar.local}
masar.attachments.upload.enabled=${MASAR_ATTACHMENTS_UPLOAD_ENABLED:false}
masar.attachments.scanning.enabled=${MASAR_ATTACHMENTS_SCANNING_ENABLED:false}
masar.attachments.scanning.host=${MASAR_ATTACHMENTS_SCANNING_HOST:127.0.0.1}
masar.attachments.scanning.port=${MASAR_ATTACHMENTS_SCANNING_PORT:13310}
masar.attachments.scanning.connection-timeout=${MASAR_ATTACHMENTS_SCANNING_CONNECTION_TIMEOUT:2s}
masar.attachments.scanning.scan-timeout=${MASAR_ATTACHMENTS_SCANNING_SCAN_TIMEOUT:60s}
masar.attachments.scanning.max-concurrent-scans=${MASAR_ATTACHMENTS_SCANNING_MAX_CONCURRENT:2}
masar.attachments.scanning.max-attempts=${MASAR_ATTACHMENTS_SCANNING_MAX_ATTEMPTS:3}
masar.attachments.scanning.retry-backoff=${MASAR_ATTACHMENTS_SCANNING_RETRY_BACKOFF:1m}
masar.attachments.scanning.claim-timeout=${MASAR_ATTACHMENTS_SCANNING_CLAIM_TIMEOUT:10m}
masar.attachments.scanning.max-stream-bytes=${MASAR_ATTACHMENTS_SCANNING_MAX_STREAM_BYTES:26214400}
masar.attachments.processing.automatic-scanning-enabled=${MASAR_ATTACHMENTS_AUTOMATIC_SCANNING_ENABLED:false}
masar.attachments.processing.reconciliation-enabled=${MASAR_ATTACHMENTS_RECONCILIATION_ENABLED:false}
masar.attachments.processing.destructive-reconciliation-enabled=${MASAR_ATTACHMENTS_DESTRUCTIVE_RECONCILIATION_ENABLED:false}
masar.attachments.processing.guest-upload-enabled=${MASAR_ATTACHMENTS_GUEST_UPLOAD_ENABLED:false}
masar.attachments.processing.batch-size=${MASAR_ATTACHMENTS_PROCESSING_BATCH_SIZE:10}
masar.attachments.processing.interval=${MASAR_ATTACHMENTS_PROCESSING_INTERVAL:30s}
masar.attachments.processing.cleanup-grace-period=${MASAR_ATTACHMENTS_CLEANUP_GRACE_PERIOD:15m}
masar.attachments.processing.cleanup-retry-backoff=${MASAR_ATTACHMENTS_CLEANUP_RETRY_BACKOFF:5m}
masar.attachments.processing.cleanup-claim-timeout=${MASAR_ATTACHMENTS_CLEANUP_CLAIM_TIMEOUT:10m}
masar.attachments.processing.max-cleanup-attempts=${MASAR_ATTACHMENTS_MAX_CLEANUP_ATTEMPTS:5}
masar.attachments.processing.guest-uploads-per-hour=${MASAR_ATTACHMENTS_GUEST_UPLOADS_PER_HOUR:20}
masar.planning.time-zone=${MASAR_PLANNING_TIME_ZONE:Asia/Riyadh}
masar.guest-tracking.secret=${MASAR_GUEST_TRACKING_SECRET}
masar.guest-tracking.cookie-secure=${MASAR_GUEST_COOKIE_SECURE:true}
