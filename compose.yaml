services:
  postgres:
    image: postgres:16
    container_name: request-management-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-request_management}
      POSTGRES_USER: ${POSTGRES_USER:-request_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
