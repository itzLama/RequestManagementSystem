services:
  postgres:
    # Pinned minor version; change deliberately (same major keeps the existing data volume compatible).
    image: postgres:16.15
    container_name: request-management-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-request_management}
      POSTGRES_USER: ${POSTGRES_USER:-request_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      # Loopback only: the backend runs on the same host. Never publish 5432 to the network.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      # Optional web UI/API basic auth, "user:password" (several separated by spaces).
      # Empty (the default) means no auth, which is acceptable only while bound to 127.0.0.1.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    ports:
      # Loopback only: the inbox contains Guest OTP codes.
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:1025:1025"
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:8025:8025"
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.6_base-debian13-slim
    profiles: ["attachments-scanning"]
    environment:
      CLAMAV_NO_MILTERD: "true"
      CLAMD_CONF_StreamMaxLength: 30M
      CLAMD_CONF_MaxThreads: 2
      CLAMD_CONF_MaxQueue: 4
      CLAMD_CONF_ReadTimeout: 60
      FRESHCLAM_CHECKS: 12
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-13310}:3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    # Only the loopback-bound published port exposes clamd to the host. Do not use an
    # `internal: true` network here: Docker Desktop on Windows does not forward
    # published ports for containers attached only to internal networks, and
    # FreshClam needs outbound access for signature updates.
    networks:
      - clamav_scanning
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  clamav_signatures:

networks:
  clamav_scanning: {}
